[loggers]
keys=root,jorek_hdf5_2_ids

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=extend,simple

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_jorek_hdf5_2_ids]
level=INFO
handlers=consoleHandler,fileHandler
qualname=jorekHDF5toIDS
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=extend
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
#filename=test.log
args=('jorekHDF5toIDS.log','a')
formatter=extend


[formatter_extend]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s

[formatter_simple]
format=%(asctime)s - %(message)s
